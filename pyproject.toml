[project]
name = "jev-fsd"
version = "0.2.0"
description = "Jev Drive Lab: a driving test for AI models, on real Canadian streets, that you can also take yourself"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["typesafe", "jev", "system-one", "ai", "driving", "simulator", "openstreetmap", "three.js"]
dependencies = [
    "typesafe-sdk>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/BrendanH18/jev_fsd"
Documentation = "https://github.com/BrendanH18/jev_fsd/blob/main/docs/reference/README.md"
Demo = "https://brendanh18.github.io/jev_fsd/"

# Jev FSD is an application, not a library: `uv run server.py` installs the dependency into a
# project venv and starts the server. No build backend is needed.
[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E741 (names like `l`): 7 existing findings; enable later.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Puts the repository on sys.path before importing jev.
"scripts/build_demo.py" = ["E402"]
