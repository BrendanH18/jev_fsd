[project]
name = "jev-fsd"
version = "0.2.0"
description = "Drive Lab: an open-source driving simulator on real OpenStreetMap streets, with Rules and TypeSafe Jev agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["typesafe", "jev", "system-one", "ai", "driving", "simulator", "openstreetmap", "three.js"]
dependencies = [
    "typesafe-sdk>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/BrendanH18/jev_fsd"
Documentation = "https://github.com/BrendanH18/jev_fsd/blob/main/docs/project-reference.md"
Demo = "https://brendanh18.github.io/jev_fsd/"

# Jev FSD is an application, not a library: `uv run server.py` installs the dependency into a
# project venv and starts the server. No build backend is needed.
[tool.uv]
package = false
