name: Browser demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Pushes to main and manual
# runs get a group of their own (the run id), so they, and the Pages deploy, are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Python and Node checks
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 30
    env:
      # Seconds each scripts/test_*.mjs may run. The slowest (test_drive_lab.mjs) takes about
      # two minutes; a failing assert on a sim object can grow without bound (see AGENTS.md).
      NODE_TEST_TIMEOUT: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Python tests
        run: uv run --locked python -m unittest discover tests
      - name: Offline Jev requests
        run: uv run --locked scripts/verify_jev.py --offline
      - name: Node checks
        run: |
          failed=()
          for f in scripts/test_*.mjs; do
            echo "::group::$f"
            rc=0
            timeout --kill-after=10s "${NODE_TEST_TIMEOUT}s" node --experimental-default-type=module "$f" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 124 ]; then
              echo "::error file=$f::$f timed out after ${NODE_TEST_TIMEOUT} s"
              failed+=("$f")
            elif [ "$rc" -eq 137 ]; then
              echo "::error file=$f::$f was killed (timed out and ignored SIGTERM, or ran out of memory)"
              failed+=("$f")
            elif [ "$rc" -ne 0 ]; then
              echo "::error file=$f::$f failed with exit code $rc"
              failed+=("$f")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed Node checks:"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi
      - name: Jev fixtures match the current pipeline
        run: node --experimental-default-type=module scripts/build_jev_fixtures.mjs --check

  browser:
    name: Browser suites
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 30
    env:
      PLAYWRIGHT: playwright==1.64.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ env.PLAYWRIGHT }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT }}
      - name: Install Playwright Chromium
        run: uv run --locked --with "$PLAYWRIGHT" python -m playwright install --with-deps chromium
      - name: Start the local server
        run: |
          uv run --locked server.py > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8322/ && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Simulation, HUD, explorer and renderer assertions
        run: uv run --locked --with "$PLAYWRIGHT" python scripts/test_browser_pages.py
      - name: Arena evaluation, history and comparisons
        run: uv run --locked --with "$PLAYWRIGHT" python scripts/test_arena_browser.py
      - name: Server log
        if: failure()
        run: cat server.log

  build:
    needs: [checks, browser]
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the browser demo
        run: python scripts/build_demo.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .demo-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
