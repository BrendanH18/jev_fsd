name: Browser demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Pushes to main and manual
# runs get a group of their own (the run id), so they, and the Pages deploy, are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python checks and Jev fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Python tests
        # tests/test_parity.py runs the JavaScript side under Node; here a missing Node is a failure
        env:
          JEV_REQUIRE_NODE: 1
        run: uv run --locked python -m unittest discover -s tests
      - name: Offline Jev requests
        run: uv run --locked scripts/verify_jev.py --offline
      - name: Jev fixtures match the current pipeline
        run: node --experimental-default-type=module scripts/build_jev_fixtures.mjs --check

  node:
    # scripts/ci_shard.mjs deals the scripts/test_*.mjs out over the shards by measured run time
    # (scripts/ci_test_times.json); scripts/test_ci_shard.mjs checks every file lands in exactly one
    # and that this matrix lists every shard.
    name: Node checks, shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      # Seconds each scripts/test_*.mjs may run. The slowest (test_scenery_collision.mjs) takes about
      # a minute or two; a failing assert on a sim object can grow without bound (see AGENTS.md).
      NODE_TEST_TIMEOUT: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Node checks
        run: |
          files=$(node scripts/ci_shard.mjs --shards 6 --shard ${{ matrix.shard }})
          if [[ -z "$files" ]]; then
            echo "::error::shard ${{ matrix.shard }} has no Node checks"
            exit 1
          fi
          mapfile -t checks <<< "$files"
          node scripts/node_checks.mjs --jobs 1 --github --json checks.json \
            --summary "$GITHUB_STEP_SUMMARY" -- "${checks[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('checks.json') != '' }}
        with:
          name: node-checks-${{ matrix.shard }}
          path: checks.json
          retention-days: 7

  browser:
    name: Browser suite, ${{ matrix.title }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # scripts/test_browser_pages.py took 16-20 min as one job; its groups take about 5 min each.
          - title: simulation, HUD, explorer and renderer
            script: scripts/test_browser_pages.py --group pages
          - title: practice finishes
            script: scripts/test_browser_pages.py --group practice
          - title: parking finishes, debrief replay and error recovery
            script: scripts/test_browser_pages.py --group parking
          - title: arena evaluation, history and comparisons
            script: scripts/test_arena_browser.py
    env:
      PLAYWRIGHT: playwright==1.64.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: ${{ env.PLAYWRIGHT }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT }}
      - name: Install Playwright Chromium
        run: uv run --locked --with "$PLAYWRIGHT" python -m playwright install --with-deps chromium
      - name: Start the local server
        run: |
          uv run --locked server.py > server.log 2>&1 &
          bash .github/workflows/wait-for-local-server.sh 8322 / "$!"
      - name: Browser assertions
        env:
          BROWSER_SCRIPT: ${{ matrix.script }}
        run: |
          read -r -a arguments <<< "$BROWSER_SCRIPT"
          uv run --locked --with "$PLAYWRIGHT" python "${arguments[@]}"
      - name: Server log
        if: failure() && hashFiles('server.log') != ''
        run: tail -n 200 server.log

  build:
    needs: [python, node, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the browser demo
        run: python scripts/build_demo.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .demo-site
  # The check the main ruleset requires. A job that a failed job `needs` is skipped, and a skipped
  # required check counts as passing, so this runs always() and passes only if every check job and the demo build passed.
  demo-passed:
    name: Demo checks passed
    needs: [python, node, browser, build]
    if: always()
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        run: |
          set -o pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$RESULTS")
          if [[ -n "$failed" ]]; then
            printf 'Required jobs did not pass:\n%s\n' "$failed"
            exit 1
          fi
          jq -e 'type == "object" and length > 0' <<< "$RESULTS" >/dev/null
        env:
          RESULTS: ${{ toJSON(needs) }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: demo-passed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Pages accepts one deployment at a time. A deploy that starts while another
    # runs waits instead of failing, and a running deploy is never cancelled.
    # GitHub keeps one waiting job per group, so a newer deploy replaces an
    # older waiting one; each deploy publishes the whole site, so the newest wins.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
