name: Browser demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser features
        run: |
          node --experimental-default-type=module scripts/test_drive_lab.mjs
          node --experimental-default-type=module scripts/test_arena_history.mjs
          node --experimental-default-type=module scripts/test_cinematic_photo.mjs
      - name: Build the browser demo
        run: python scripts/build_demo.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .demo-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
