name: City interaction soak
# Report-only while city failures are being triaged (ROADMAP.md 1.6/1.7): a failing leg does not turn
# the run red (continue-on-error). The summary job lists every leg's failed routes in the run summary
# and as warning annotations (scripts/soak_summary.py), so they stay visible.
on:
  schedule:
    # Thursdays, so it never shares runners with the Monday benchmark (bench.yml), which ran twice
    # as slow when both ran at once.
    - cron: '43 9 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    name: City maps/seeds and feature pairs, shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # (the slowest leg took 15½ min on Namespace's runners; GitHub's standard runner is about twice as slow)
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      # The leg's artifact name; scripts/soak_summary.py expands these LEG lines to list every leg.
      LEG: soak-${{ matrix.shard }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the leg
        run: echo "$LEG" > leg.txt
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Start the local server
        run: |
          PORT=8381 uv run --locked server.py > server.log 2>&1 &
          bash .github/workflows/wait-for-local-server.sh 8381 /bench "$!"
      - name: Rules, city samples and every covering row
        run: >
          node --experimental-default-type=module scripts/soak.mjs --port 8381
          --maps kitsilano,toronto,calgary,victoria --seeds 1,2,3 --count 2
          --shard "$SHARD" --shards 8 --json soak.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ env.LEG }}
          retention-days: 14
          path: |
            leg.txt
            soak.json
            server.log

  park-night:
    name: City ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: dry parking, weather: dry, options: '--park 1' }
          - { label: dry 23h30, weather: dry, options: '--hour 23.5' }
          - { label: dry 06h30, weather: dry, options: '--hour 6.5' }
          - { label: fog 23h30, weather: fog, options: '--hour 23.5' }
    env:
      LEG: city ${{ matrix.label }}
      WEATHER: ${{ matrix.weather }}
      OPTIONS: ${{ matrix.options }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the leg
        run: echo "$LEG" > leg.txt
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Start the local server
        run: |
          PORT=8381 uv run --locked server.py > server.log 2>&1 &
          bash .github/workflows/wait-for-local-server.sh 8381 /bench "$!"
      - name: Rules, Kitsilano, suite seed 1
        run: |
          read -r -a arguments <<< "$OPTIONS"
          node --experimental-default-type=module scripts/bench_node.mjs --port 8381 \
            --features city --weather "$WEATHER" "${arguments[@]}" --check 1 --json run.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ env.LEG }}
          retention-days: 14
          path: |
            leg.txt
            run.json
            server.log

  summary:
    name: Soak summary
    needs: [soak, park-night]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # (one directory per artifact, but a lone artifact lands directly in legs/: its leg.txt names it)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          path: legs
      - name: Failed legs
        run: python3 scripts/soak_summary.py legs
