name: CodeQL
# Advanced setup, so the analysis runs on a Namespace runner (default setup only offers GitHub-hosted
# runners or labels that Namespace's ephemeral runners do not match). Same languages, query suite
# (default) and categories (/language:<language>) as the default setup it replaces.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # (no `queries`: the default suite, as default setup ran)
          # static/vendor/three is a vendored copy of Three.js; data/ is generated map packs and results.
          config: |
            paths-ignore:
              - static/vendor/three
              - data
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
