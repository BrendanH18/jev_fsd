name: CodeQL
# Advanced setup, so the analysis can leave out the vendored Three.js and the generated data/ (default
# setup takes no configuration) and its actions stay pinned and updated like the other workflows'.
# Same languages, query suite (default) and categories (/language:<language>) as the default setup it
# replaces.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # (no `queries`: the default suite, as default setup ran)
          # static/vendor/three is a vendored copy of Three.js; data/ is generated map packs and results.
          config: |
            paths-ignore:
              - static/vendor/three
              - data
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
