name: Lint
# Ruff lints and checks the formatting of the Python; Biome does both for the browser JavaScript.
# Warnings fail the job (`npm run lint` is `biome ci --error-on-warnings .`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Lint Python
        run: uv run --locked ruff check
      - name: Check Python formatting
        run: uv run --locked ruff format --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      # Biome's version comes from package-lock.json, which Dependabot keeps up to date.
      - name: Install Biome
        run: npm ci
      - name: Lint and check formatting of JavaScript
        run: npm run lint
