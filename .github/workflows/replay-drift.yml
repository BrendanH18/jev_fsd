name: Published recording replay drift
on:
  schedule:
    - cron: '34 9 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tapes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.tapes.outputs.matrix }}
      count: ${{ steps.tapes.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find every published tape
        id: tapes
        run: |
          matrix=$(python3 scripts/report_replay_drift.py matrix)
          count=$(jq -er '.include | select(type == "array") | length' <<< "$matrix")
          {
            echo "matrix=$matrix"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"
          if [[ "$count" == 0 ]]; then
            echo "No published replay tapes were found." >> "$GITHUB_STEP_SUMMARY"
          fi

  replay:
    name: ${{ matrix.tape }}
    needs: tapes
    if: needs.tapes.outputs.count != '0'
    runs-on: ubuntu-24.04
    # (45 min on Namespace's runners; GitHub's standard runner is about twice as slow)
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tapes.outputs.matrix) }}
    env:
      TAPE: ${{ matrix.tape }}
      REPLAY_RUNNER: ${{ matrix.runner }}
      DRIVE_COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: report
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Replay on main
        id: main-replay
        working-directory: report
        run: python3 scripts/report_replay_drift.py run . "$TAPE" "$REPLAY_RUNNER" "$DRIVE_COUNT" main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: published
        if: ${{ !cancelled() && (success() || steps.main-replay.outcome == 'failure') }}
        with:
          persist-credentials: false
          path: published
          ref: ${{ matrix.tree }}
      - name: Replay on the published revision
        if: ${{ !cancelled() && steps.published.outcome == 'success' }}
        working-directory: report
        run: python3 scripts/report_replay_drift.py run ../published "$TAPE" "$REPLAY_RUNNER" "$DRIVE_COUNT" published
