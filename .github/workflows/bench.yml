name: Seeded benchmark
# Rules over the seeded Kitsilano suite, in the bare world (every opt-in feature off, as the
# benchmark always was) and the city world (the free drive's features: static/js/sim/free-drive.js).
# Every change runs both in dry weather; the weekly run adds the city world in fog, rain and snow.
# Any route that fails, throws or gets stuck fails the job (scripts/bench_node.mjs --check 1).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: ${{ matrix.hard && 'Hard city slice' || format('{0} world, {1}', matrix.features, matrix.weather) }}
    runs-on: ubuntu-24.04
    # On Namespace's runners, weekly and manual city legs took about 20 min and city snow over 30;
    # pushes and pull requests run dry only, the city leg in about 10 min. GitHub's standard runner
    # is about twice as slow, so they get 120 and 45 min.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        features: [bare, city]
        weather: [dry, fog, rain, snow]
        scheduled:
          - ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        exclude:
          # every change: dry only; the bare world's other weathers stay as recorded in docs/rules-baseline.md
          - features: bare
            weather: fog
          - features: bare
            weather: rain
          - features: bare
            weather: snow
          - scheduled: false
            weather: fog
          - scheduled: false
            weather: rain
          - scheduled: false
            weather: snow
        include:
          - { features: hard-city, hard: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Start the local server
        run: |
          PORT=8331 uv run --locked server.py > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8331/bench && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Rules, Kitsilano, suite seed 1
        if: ${{ !matrix.hard }}
        run: >
          node --experimental-default-type=module scripts/bench_node.mjs --port 8331 --map kitsilano
          --features ${{ matrix.features }} --weather ${{ matrix.weather }} --check 1
      - name: Rules, fixed hard city slice
        if: ${{ matrix.hard }}
        run: >
          node --experimental-default-type=module scripts/soak.mjs --port 8331
          --mode hard --json hard-city.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.hard }}
        with:
          name: hard-city
          path: hard-city.json
      - name: Server log
        if: failure()
        run: tail -n 200 server.log

  # The check the main ruleset requires. A job that a failed job `needs` is skipped, and a skipped
  # required check counts as passing, so this runs always() and passes only if every benchmark leg passed.
  bench-passed:
    name: Benchmark passed
    needs: [suite]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        run: |
          echo "Results: $RESULTS"
          test "$(echo "$RESULTS" | tr ' ' '\n' | sort -u)" = success
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
